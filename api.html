<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>weather app</h1>
    <p id="weather">loading.. </p>
    <script>
        let params = new URLSearchParams({
            name: "zibah",
            age: 19
        })
        console.log(params.toString())
        let latitude = 45.67
        let longitude = 23.56
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,is_day,precipitation&forecast_days=16`)
        .then(response => {
            console.log(response.status)
            if(response.ok){
                console.log("it passed")
       return response.json()
            } else{
                console.log("it failed")
            }
    })
        .then(data => {
            console.log(data)
            let temperature = data.current.temperature_2m
            let precipitation = data.current.precipitation
           let isprecipitation = ""
            if (precipitation == 0){
                 isprecipitation = "Not Raining"
            }else{
                 isprecipitation = "Raining"
            }
            let isDay = data.current.is_day
            let checkisday = ""
            if(isDay == 0){
                checkisday = "Night"
            }else{
                checkisday = "Day"
            }
            let time = data.current.time
            let tempunit = data.current_units.temperature_2m
            let weatherreport = document.getElementById("weather")
            weatherreport.textContent = `For today: ${time}, The temperature is ${temperature}${tempunit}. It is ${checkisday} time and it is ${isprecipitation}.`
        })
        .catch(error => {
            console.log("LOL na error")
        })
    </script>
</body>
</html>
